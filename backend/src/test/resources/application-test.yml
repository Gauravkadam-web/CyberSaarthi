server:
  port: -1
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: cybersaarthi-backend-test

  datasource:
    url: jdbc:h2:mem:cybersaarthi_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    show-sql: false
    open-in-view: false

  flyway:
    enabled: false

cybersaarthi:
  security:
    jwt:
      secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:3000
  ml-service:
    url: http://localhost:8000
    timeout-ms: 1000

logging:
  level:
    org.cybersaarthi: WARN
    org.springframework: WARN
