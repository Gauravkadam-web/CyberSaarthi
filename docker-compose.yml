services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: cybersaarthi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cybersaarthi_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cybersaarthi_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Python FastAPI ML Inference Microservice
  ml-service:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: cybersaarthi-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      HOST: "0.0.0.0"
      PORT: 8000
      CONFIDENCE_THRESHOLD: 0.60
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 3. Java 21 Spring Boot Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cybersaarthi-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cybersaarthi_dev
      DB_USER: postgres
      DB_PASSWORD: postgres
      ML_SERVICE_URL: http://ml-service:8000
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:80,http://localhost
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      JWT_EXPIRATION_MS: 86400000

  # 4. React Vite Frontend (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cybersaarthi-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
